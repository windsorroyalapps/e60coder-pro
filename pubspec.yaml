name: e60coder_pro
description: BMW E60 / N54-N55 Advanced OBD Coding, Live Gauges & AI Tuning Command Center
publish_to: 'none'
version: 4.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_blue_plus: ^1.32.12
  permission_handler: ^11.3.1
  nfc_manager: ^3.5.0
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  # USB serial for K-DCAN cables (FTDI / CH340 / CP210x)
  # Uncomment when testing real hardware:
  # usb_serial: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
